<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汪贝付款直链二维码</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="neon-border"></div>
        <div class="light-sweep"></div>
        <h1>汪贝付款直链二维码</h1>
        <!-- 单一场次倒计时面板（核心修改） -->
        <div class="countdown-panel">
            <div class="current-date" id="currentDate"></div>
            <span class="countdown-label" id="countdownLabel">距离本场开始剩余</span>
            <div class="countdown-value" id="countdownValue">00:00:00</div>
        </div>
        <button id="generateBtn">
            <span class="btn-loading-icon"></span>
            <span class="btn-text">获取本场商品（码未更新）</span>
        </button>
        <div id="resultArea"></div>
        <div class="copy-success" id="copySuccess">二维码对应链接复制成功！</div>
    </div>

    <!-- 引入二维码生成库 -->
    <script src="https://cdn.bootcdn.net/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- 1. 全局变量定义 -->
    <script src="config.js"></script>

    <!-- 商品解析模块（保持不变） -->
    <script src="spjx.js"></script>

    <!-- 二维码渲染与复制功能（保持不变） -->
    <script src="ewm.js"></script>

    <!-- 按钮交互事件（保持不变） -->
    <script src="an.js"></script>

    <!-- 核心：时段判断+单倒计时逻辑（按要求重写） -->
    <script src="sjpd.js"></script>

    <!-- 新增：获取GitHub提交时间并展示的逻辑 -->
    <script>
        // 格式化时间为 年-月-日 时:分:秒 格式
        function formatCommitTime(isoTimeStr) {
            const date = new Date(isoTimeStr);
            // 补零函数，确保数字为两位数
            const padZero = (num) => num.toString().padStart(2, '0');
            
            const year = date.getFullYear();
            const month = padZero(date.getMonth() + 1); // 月份从0开始，需+1
            const day = padZero(date.getDate());
            const hours = padZero(date.getHours());
            const minutes = padZero(date.getMinutes());
            
            return `${year}/${month}/${day} ${hours}:${minutes}`;
        }

        // 判断提交时间是否符合更新条件
        function checkIfCodeUpdated(commitDate) {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            
            // 提取提交时间的日期（年/月/日）
            const commitDay = new Date(commitDate.getFullYear(), commitDate.getMonth(), commitDate.getDate());
            const commitHour = commitDate.getHours();
            
            // 当前时间的小时
            const currentHour = now.getHours();

            // 情况1：提交时间是昨天 → 未更新
            if (commitDay.getTime() === yesterday.getTime()) {
                return false;
            }

            // 情况2：提交时间是今天
            if (commitDay.getTime() === today.getTime()) {
                // 2.1 当前时间在00:00-17:00，且提交时间也在00:00-17:00 → 已更新
                if (currentHour < 17 && commitHour < 17) {
                    return true;
                }
                // 2.2 当前时间在17:00-24:00，且提交时间也在17:00-24:00 → 已更新
                else if (currentHour >= 17 && commitHour >= 17) {
                    return true;
                }
                // 2.3 当前时间在17:00-24:00，但提交时间在00:00-17:00 → 未更新
                else {
                    return false;
                }
            }

            // 其他情况（提交时间早于昨天）→ 未更新
            return false;
        }

        // 从GitHub API获取config.js的最新提交时间
        async function getLatestConfigUpdateTime() {
            try {
                // GitHub API地址：获取指定仓库指定文件的最新提交信息
                const apiUrl = 'https://api.github.com/repos/xmzyh/wbdh.github.io/commits/main?path=config.js';
                const response = await fetch(apiUrl);

                // 处理API请求失败的情况
                if (!response.ok) {
                    throw new Error(`请求失败，状态码：${response.status}`);
                }

                const commitData = await response.json();
                // 提取提交时间（ISO格式）并格式化
                const commitTimeStr = commitData.commit.committer.date;
                const commitDate = new Date(commitTimeStr);
                const formattedTime = formatCommitTime(commitTimeStr);
                
                // 判断是否更新并返回结果
                const isUpdated = checkIfCodeUpdated(commitDate);
                return {
                    displayText: `商品码更新时间：${formattedTime}`,
                    isCodeUpdated: isUpdated
                };
            } catch (error) {
                // 出错时返回默认文字，不影响页面正常使用
                console.error('获取config.js最新更新时间失败：', error);
                return {
                    displayText: '最新更新时间：未知',
                    isCodeUpdated: false
                };
            }
        }

        // 页面初始化（修改并整合原有逻辑）
        async function initPage() {
            // 获取DOM元素
            const generateBtn = document.getElementById('generateBtn');
            const resultArea = document.getElementById('resultArea');
            const copySuccess = document.getElementById('copySuccess');
            const btnText = document.querySelector('.btn-text');
            const countdownLabel = document.getElementById('countdownLabel');
            const countdownValue = document.getElementById('countdownValue');
            // 新增：获取展示更新时间的DOM元素
            const updateTime = document.getElementById('updateTime');
            
            // 核心修改：获取最新更新时间并判断是否更新
            const updateInfo = await getLatestConfigUpdateTime();
            // 展示更新时间
            updateTime.textContent = updateInfo.displayText;
            // 根据判断结果修改按钮文字
            if (updateInfo.isCodeUpdated) {
                btnText.textContent = '获取本场商品（码已更新）';
            } else {
                btnText.textContent = '获取本场商品（码未更新）';
            }
            
            // 初始化倒计时和事件（原有逻辑）
            // 确保initCountdown和initEventListeners函数已定义
            if (typeof initCountdown === 'function') initCountdown();
            if (typeof initEventListeners === 'function') initEventListeners();
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
