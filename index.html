<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汪贝付款直链二维码</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .btn-text {
            display: block;
            white-space: normal;
            line-height: 1.2;
            text-align: center;
        }
        #generateBtn {
            padding: 12px 20px;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="neon-border"></div>
        <div class="light-sweep"></div>
        <h1>汪贝付款直链二维码</h1>
        <div class="countdown-panel">
            <div class="current-date" id="currentDate"></div>
            <span class="countdown-label" id="countdownLabel">距离本场开始剩余</span>
            <div class="countdown-value" id="countdownValue">00:00:00</div>
        </div>
        <button id="generateBtn">
            <span class="btn-loading-icon"></span>
            <span class="btn-text">
                <span class="btn-line2"></span><br>
                <span class="btn-line1">点我获取商品二维码</span>
            </span>
        </button>
        <div id="resultArea"></div>
        <div class="copy-success" id="copySuccess">二维码对应链接复制成功！</div>
    </div>

    <script src="https://cdn.bootcdn.net/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="config.js"></script>
    <script src="spjx.js"></script>
    <script src="ewm.js"></script>
    <script src="an.js"></script>
    <script src="sjpd.js"></script>

    <script>
        function formatCommitTime(isoTimeStr) {
            if (!isoTimeStr) return "获取失败";
            const date = new Date(isoTimeStr);
            const padZero = (num) => num.toString().padStart(2, '0');
            
            const year = date.getFullYear();
            const month = padZero(date.getMonth() + 1);
            const day = padZero(date.getDate());
            const hours = padZero(date.getHours());
            const minutes = padZero(date.getMinutes());
            
            return `${year}-${month}-${day} ${hours}:${minutes}`;
        }

        // 核心修改：添加跨域代理，解决访问限制
        async function getLatestConfigUpdateTime() {
            try {
                // 使用ghproxy代理GitHub API，绕过跨域和部分访问限制
                const apiUrl = 'https://ghfast.top/https://api.github.com/repos/xmzyh/wbdh.github.io/contents/config.js?ref=main';
                
                // 添加请求头，模拟浏览器请求，降低被拦截概率
                const response = await fetch(apiUrl, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                        'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
                    },
                    timeout: 10000 // 10秒超时
                });

                if (!response.ok) {
                    // 打印详细状态码和信息，方便排查
                    const errorText = await response.text();
                    console.error('API响应失败：', response.status, errorText);
                    throw new Error(`状态码：${response.status}`);
                }

                const fileData = await response.json();
                // 兼容不同返回格式的判断
                if (!fileData.commit || !fileData.commit.commit || !fileData.commit.commit.committer) {
                    throw new Error('返回数据格式异常');
                }
                const commitTime = fileData.commit.commit.committer.date;
                return formatCommitTime(commitTime);
            } catch (error) {
                console.error('获取config.js更新时间失败详情：', error);
                // 分级提示，方便排查
                if (error.message.includes('403')) {
                    return "频率限制";
                } else if (error.message.includes('404')) {
                    return "文件不存在";
                } else if (error.message.includes('timeout')) {
                    return "请求超时";
                } else {
                    return "获取失败";
                }
            }
        }

        async function initPage() {
            const generateBtn = document.getElementById('generateBtn');
            const resultArea = document.getElementById('resultArea');
            const copySuccess = document.getElementById('copySuccess');
            const btnLine2 = document.querySelector('.btn-line2');
            const countdownLabel = document.getElementById('countdownLabel');
            const countdownValue = document.getElementById('countdownValue');
            
            const latestUpdateTime = await getLatestConfigUpdateTime();
            btnLine2.textContent = `码更新时间（${latestUpdateTime}）`;
            
            if (typeof initCountdown === 'function') {
                initCountdown();
            }
            if (typeof initEventListeners === 'function') {
                initEventListeners();
            }
        }

        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
